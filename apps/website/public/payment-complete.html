<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thank You — Scottsdale Handyman Solutions</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" />
<style>
  :root{ --navy:#0b2545; --slate:#374151; --yellow:#ffb020; --off-white:#f6f7f9;
         --gray-200:#e6edf4; --gray-500:#6b7280; --green:#366e5c; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
       color:var(--slate);background:var(--off-white);padding:1.25rem;line-height:1.6}
  .card{background:#fff;border:1px solid var(--gray-200);border-radius:16px;max-width:520px;width:100%;
        padding:clamp(1.5rem,5vw,2.75rem);text-align:center;box-shadow:0 10px 40px rgba(11,37,69,.08)}
  .tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:flex;
        align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1.25rem}
  h1{color:var(--navy);font-size:1.5rem;margin:0 0 .6rem}
  p{margin:0 0 1rem;color:var(--gray-500)}
  .next{background:var(--off-white);border:1px solid var(--gray-200);border-radius:10px;
        padding:1rem;text-align:left;margin:1.5rem 0}
  .next strong{color:var(--navy);display:block;margin-bottom:.35rem}
  .btn{display:inline-block;background:var(--yellow);color:#3a2600;font-weight:700;
       text-decoration:none;padding:.8rem 1.6rem;border-radius:10px;margin-top:.5rem}
  .btn.secondary{background:transparent;color:var(--navy);border:1px solid var(--gray-200);margin-left:.5rem}
  .phone{font-weight:700;color:var(--navy);text-decoration:none}
  .ref{font-size:.78rem;color:#9aa6b0;margin-top:1.5rem;word-break:break-all}
</style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1 id="headline">Thank you — payment received</h1>
    <p id="blurb">We've emailed your receipt.</p>

    <div class="next">
      <strong>What happens next</strong>
      <span id="next-text">We'll be in touch shortly to confirm the details and schedule your visit.</span>
    </div>

    <p>Questions? Call <a class="phone" href="tel:+14802555887">(480) 255-5887</a> — 24/7 for emergencies.</p>

    <a class="btn" href="/">Back to site</a>
    <a class="btn secondary" href="/terms.html">Terms</a>

    <div class="ref" id="ref"></div>
  </div>

<script>
  var params = new URLSearchParams(window.location.search);
  var type = params.get('type');
  var session = params.get('session_id');

  var copy = {
    booking: {
      headline: 'Booking confirmed',
      blurb: "Your payment went through and your booking is locked in. A receipt is on its way to your email.",
      next: "We'll call to agree a time that suits you, then arrive ready to work. If anything changes, just call us."
    },
    plan: {
      headline: "You're on the plan",
      blurb: 'Your monthly maintenance plan is active. A receipt is on its way to your email.',
      next: "We'll reach out to book your first visit. Your plan renews monthly and you can cancel any time with 30 days' notice — see our terms."
    },
    payment: {
      headline: 'Payment received',
      blurb: "Thanks — that's settled. A receipt is on its way to your email.",
      next: "Nothing further needed from you. We'll be in touch about the next stage of the work."
    }
  };

  var c = copy[type] || copy.payment;
  document.getElementById('headline').textContent = c.headline;
  document.getElementById('blurb').textContent = c.blurb;
  document.getElementById('next-text').textContent = c.next;
  document.title = c.headline + ' — Scottsdale Handyman Solutions';
  if (session) document.getElementById('ref').textContent = 'Reference: ' + session;
</script>
</body>
</html>
